# Zacess Scenes settings, linked to ~/.config/zacess/scenes.toml (%APPDATA%\zacess\scenes.toml on
# Windows) by setup.sh or setup.ps1. Every key is optional; `zacess-scenes config init` writes the
# full commented reference to compare against.
#
# there is no theme key on purpose: Scenes reads the theme zt last set from
# ~/.local/state/zacess/theme, so it always matches the terminal.

[scenes]
# calm scenes for a passing build, picked in turn
pass = ["koi-pond", "lanterns", "tea", "winter-cabin", "constellations", "city-night", "aurora", "cat-nap", "mountain-lake", "garden", "balloons", "rocket-launch", "pit-stop", "pcb-bring-up", "drone-landing", "kettle-boil", "build-passed", "football"]
# slow failure scenes
fail = ["storm", "flood", "fog", "tangle", "leak", "short-circuit", "thin-ice", "launch-scrub", "pit-stop-stuck", "dead-led", "landing-abort", "kettle-cold", "build-failed", "football"]
rotation = "shuffle"
# minutes before the next scene, in the watch and follow modes and in a scene run on its own
interval = 5
motion = "calm"

[sound]
enabled = true
set = "bells"
volume = 40
quiet_hours = "22:00-07:00"

[sound.events]
# a soft tone when a followed shell could not find a command
typo = true

[notifications]
enabled = false

[ambient]
# a quiet background sound that suits the scene; a turns it on while a scene runs and [ and ]
# change its volume
enabled = false
volume = 20

[follow]
# every command in a followed shell counts, typos included
min_seconds = 0
