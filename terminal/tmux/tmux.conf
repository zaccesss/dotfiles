# the prefix stays at tmux's default, Ctrl-b. Every Ctrl-letter combo already has a readline
# binding in most shells, so moving the prefix to Ctrl-a only swaps which binding gets shadowed
# (backward-char for beginning-of-line) while breaking the default every tutorial teaches.

set -g mouse on
set -g base-index 1 # windows start at 1, not 0, matching how they are counted on the status bar
setw -g pane-base-index 1
set -g renumber-windows on # closing a window shifts the rest down so numbers stay contiguous
set -g history-limit 10000
set -g escape-time 10 # near-zero delay after Esc, so it never lags behind in Neovim
set -g focus-events on
set -sa terminal-overrides ",xterm*:Tc" # true colour support in every pane

# split panes with the characters that show the split direction, keeping the current path.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vi-style h/j/k/l pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize in larger, noticeable steps.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# reload the config without restarting the session.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# vi-style copy mode: v to start a selection, y to yank it, matching Vim's own visual mode.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# status bar: the terminal's own background and text colours, so it stays high contrast in
# both light and dark mode; the current window is bold and reversed to stand out in either
set -g status-style "bg=default,fg=default"
set -g status-left "#[bold]#S "
set -g status-right "%Y-%m-%d %H:%M"
set -g window-status-current-style "bold,reverse"

# tab colours: each window name gets its own terminal colour, so common windows are easy to find at a glance. The
# current tab is a solid block of that colour, bold and marked with *, so it stands out by shape as well as colour.
# Any other name falls back to blue
set -g @tab-colour "#{?#{==:#{window_name},editor},cyan,#{?#{==:#{window_name},git},green,#{?#{==:#{window_name},search},yellow,#{?#{==:#{window_name},shell},magenta,blue}}}}"
set -g window-status-format "#[fg=#{E:@tab-colour}] #I:#W "
set -g window-status-current-format "#[fg=#{E:@tab-colour},bold,reverse] #I:#W* #[default]"

# plugins via TPM (Tmux Plugin Manager), installed separately, see guides/setup.md.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # save and restore session layout across a restart
set -g @plugin 'tmux-plugins/tmux-continuum' # auto-saves the session every 15 minutes
set -g @continuum-restore 'on'

if-shell '[ -f ~/.tmux/plugins/tpm/tpm ]' 'run ~/.tmux/plugins/tpm/tpm'
