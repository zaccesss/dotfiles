# the prefix stays at tmux's default, Ctrl-b. Every Ctrl-letter combo already has a readline
# binding in most shells, so moving the prefix to Ctrl-a only swaps which binding gets shadowed
# (backward-char for beginning-of-line) while breaking the default every tutorial teaches.

set -g mouse on
set -g base-index 1 # windows start at 1, not 0, matching how they are counted on the status bar
setw -g pane-base-index 1
set -g renumber-windows on # closing a window shifts the rest down so numbers stay contiguous
set -g history-limit 10000
set -g escape-time 10 # near-zero delay after Esc, so it never lags behind in Neovim
set -g focus-events on
set -sa terminal-overrides ",xterm*:Tc" # true colour support in every pane

# split panes with the characters that show the split direction, keeping the current path.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vi-style h/j/k/l pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ctrl+H/J/K/L move between tmux panes and Neovim splits as one set, through vim-tmux-navigator
# (loaded below, with its Neovim half in the Neovim config). In a shell pane those keys no longer
# reach readline, so the prefix sends each one on: Ctrl+B then Ctrl+L clears the screen, Ctrl+B
# then Ctrl+K cuts to the end of the line, Ctrl+B then Ctrl+H deletes back a character and
# Ctrl+B then Ctrl+J is a new line.
bind C-h send-keys C-h
bind C-j send-keys C-j
bind C-k send-keys C-k
bind C-l send-keys C-l

# Ctrl+B then f: a fuzzy list of the project folders. Picking one opens its ide layout (or goes
# back to it when it is already open) without leaving tmux
bind f display-popup -E -w 70% -h 60% -T " projects " "zsh -ic 'ide-pick'"

# resize in larger, noticeable steps.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# reload the config without restarting the session.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# the mouse wheel scrolls back as usual, except over a Zacess scene: entering scroll mode there
# freezes the picture, so the wheel goes to the scene instead, which ignores it
bind -n WheelUpPane if -F "#{||:#{||:#{alternate_on},#{pane_in_mode}},#{||:#{mouse_any_flag},#{==:#{pane_current_command},zacess-scenes}}}" { send-keys -M } { copy-mode -e }

# vi-style copy mode: v to start a selection, y to yank it, matching Vim's own visual mode.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# status bar: the terminal's own background and text colours, so it stays high contrast in
# both light and dark mode; the current window is bold and reversed to stand out in either
set -g status-style "bg=default,fg=default"
set -g status-left "#[bold]#S "
# room for a whole session name, since ide names each session after its project folder
set -g status-left-length 40
set -g status-right "%Y-%m-%d %H:%M"
set -g window-status-current-style "bold,reverse"

# the active pane is marked by arrows in its border as well as by its border colour
set -g pane-border-indicators both

# the colours that differ per theme (status bar, message line, copy mode and pane borders) come from
# themes/, one file per Zacess theme generated from the terminal palette, which zt links into the
# state folder as tmux.conf. Without the link tmux keeps the terminal's own colours
run-shell 'tmux source-file -q "${XDG_STATE_HOME:-$HOME/.local/state}/zacess/tmux.conf"'

# tab colours: each window name gets its own terminal colour, so common windows are easy to find at a glance. The
# current tab is a solid block of that colour, bold and marked with *, so it stands out by shape as well as colour.
# Any other name falls back to blue
set -g @tab-colour "#{?#{==:#{window_name},editor},cyan,#{?#{==:#{window_name},git},green,#{?#{==:#{window_name},search},yellow,#{?#{==:#{window_name},shell},magenta,blue}}}}"
set -g window-status-format "#[fg=#{E:@tab-colour}] #I:#W "
set -g window-status-current-format "#[fg=#{E:@tab-colour},bold,reverse] #I:#W* #[default]"

# plugins via TPM (Tmux Plugin Manager), installed separately, see guides/setup.md.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # save and restore session layout across a restart
set -g @plugin 'tmux-plugins/tmux-continuum' # auto-saves the session every 15 minutes
set -g @plugin 'christoomey/vim-tmux-navigator' # Ctrl+H/J/K/L across panes and Neovim splits
set -g @continuum-restore 'on'

if-shell '[ -f ~/.tmux/plugins/tpm/tpm ]' 'run ~/.tmux/plugins/tpm/tpm'
