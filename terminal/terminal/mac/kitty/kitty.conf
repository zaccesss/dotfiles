# High-contrast starter config. All eight Zacess themes sit in this folder (zacess-*.conf, from
# palette/zacess.json) and the include below picks one, Zacess Deep Contrast Dark by default.
# The `zt` command in the dotfiles rewrites that line. `zt auto` writes dark-theme.auto.conf and
# light-theme.auto.conf, which Kitty 0.38 and later follows with the system.

include zacess-deep-contrast-dark.conf

font_family      SF Mono
font_size        13.0

scrollback_lines 10000
background_opacity 1.0
