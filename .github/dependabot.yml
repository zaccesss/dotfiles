# Dependabot configuration.
# checks for outdated GitHub Actions versions on the 1st and 15th of each month and opens a pull request
# for each update so action pins stay current without manual tracking.

version: 2

updates:
  # GitHub Actions workflow dependencies (pins action versions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 18 1,15 * *"
      timezone: Europe/London
    groups:
      actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"
