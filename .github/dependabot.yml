# Dependabot configuration.
# checks for outdated GitHub Actions versions every Sunday at 18:00 UK time and opens a pull request
# for each update so action pins stay current without manual tracking.

version: 2

updates:
  # GitHub Actions workflow dependencies (pins action versions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    groups:
      actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"
