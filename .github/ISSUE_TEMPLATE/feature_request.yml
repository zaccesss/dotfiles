name: Feature request
description: Propose a new alias, function or a fix to an existing one
title: "feat: "
labels: ["enhancement"]
assignees:
  - zaccesss
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: A short sentence explaining what this issue covers.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What real problem does this solve? See CONTRIBUTING.md's "what belongs here" before opening this.
    validations:
      required: true
  - type: checkboxes
    id: platform
    attributes:
      label: Which platform(s) does it need
      options:
        - label: macOS
        - label: Linux
        - label: Windows
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, related issues, edge cases to watch for.
    validations:
      required: false
